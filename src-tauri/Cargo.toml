[package]
name = "umbra"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "umbra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
umbra-core = { path = "../crates/umbra-core" }

[dev-dependencies]
# Only #[tokio::test] needs an executor to run async #[tauri::command] fns
# directly in tests; the app itself uses Tauri's own runtime, not tokio.
tokio = { version = "1", features = ["macros", "rt"] }
# `bucket_extract_text` (Story 4.1) is this codebase's first command needing an `AppHandle` —
# every prior command's tests call the plain async fn directly (no Tauri context needed). A real
# `AppHandle` can only come from a built app, so its tests go through `tauri::test`'s mock
# IPC round trip instead (`mock_builder()` + `get_ipc_response`).
tauri = { version = "2", features = ["test"] }

