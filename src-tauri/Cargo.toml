[package]
name = "umbra"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "umbra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Only for this crate's own integration tests (`tests/*.rs`): `#[cfg(test)]` does not propagate
# to an integration-test binary linking against this crate's ordinarily-compiled rlib (Cargo
# compiles the library once, without `--cfg test`, then links every `tests/*.rs` binary against
# that same build) — see bucket.rs's `models_dir`/`OCR_ENGINE_INIT_CALLS` for what this gates.
test-support = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Same major version tauri-build's own tauri-winres dependency pins (embed-resource = "3"), so
# this resolves to the identical already-locked crate — see build.rs's comment for why a second,
# direct call into it is needed here.
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
umbra-core = { path = "../crates/umbra-core" }

[dev-dependencies]
# Only #[tokio::test] needs an executor to run async #[tauri::command] fns
# directly in tests; the app itself uses Tauri's own runtime, not tokio.
tokio = { version = "1", features = ["macros", "rt"] }
# `bucket_extract_text` (Story 4.1) is this codebase's first command needing an `AppHandle` —
# every prior command's tests call the plain async fn directly (no Tauri context needed). A real
# `AppHandle` can only come from a built app, so its tests go through `tauri::test`'s mock
# IPC round trip instead (`mock_builder()` + `get_ipc_response`).
tauri = { version = "2", features = ["test"] }
# Test-only: decodes the shared PNG fixture into raw RGBA for
# `bucket_extract_text_from_clipboard`'s tests (Story 4.2). Same crate + version umbra-core
# already depends on directly — not a second image-handling library, just this crate's own
# dev-only use of it to build test input.
image = "0.25"
# Self-dependency (a documented, supported Cargo pattern): lets `tests/*.rs` integration binaries
# link against this crate with `test-support` turned on, without that feature ever being enabled
# for a normal build or a downstream consumer. Story 4.3's `ocr_engine_race` integration test is
# what needs it (AC3: proves the real `OCR_ENGINE` static's exactly-once-under-race guarantee, in
# a fresh process where it's genuinely uninitialized — unlike this crate's own unit tests, which
# share one process and therefore can't reliably race the not-yet-initialized window).
umbra = { path = ".", features = ["test-support"] }
# Test-only, same rationale as the `image` dev-dependency above: builds small valid in-test PDF
# fixtures for `commands/pdf.rs`'s integration tests. Same crate + default-features=false setting
# umbra-core already depends on directly (see that crate's Cargo.toml comment for why) — not a
# second PDF library, just this crate's own dev-only use of it to build test input.
lopdf = { version = "0.44", default-features = false }

