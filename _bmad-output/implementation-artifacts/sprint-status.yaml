  - epic: 5
    action: "Investigate why guard-commit-privacy.sh's existing home-path detection pattern did not fire during Story 5.1's actual git commit calls, despite the leaked content matching it"
    owner: "developer"
    status: done
    # investigated 2026-08-10: confirmed the hook was present, executable, and correctly
    # registered throughout Story 5.1's session -- not a "hook didn't exist" issue. Found
    # and fixed one real, reproducible bug independent of root cause: the generic
    # /Users//home/ fallback pattern required a trailing "/" after the username, so a
    # bare path with no subpath (e.g. "outside /Users/<name> entirely") slipped through --
    # verified via a live regex test before and after the fix. The $HOME-derived pattern
    # (rule 1) has no such gap and should have caught any literal path substring, so its
    # failure isn't fully explained by the regex gap alone; hardened defensively anyway
    # (fallback to the passwd-database home dir if $HOME is unset/empty at hook-execution
    # time). One structural hypothesis moved from "unprovable" to CONFIRMED, live, during
    # this very fix: combining `git add` and `git commit` in one Bash invocation makes the
    # hook's `git diff --cached` check run against the index as it stood *before* that same
    # call's own `git add` executes, since PreToolUse fires before any part of the command
    # runs -- reproduced directly (commit 43b0f8c initially blocked on stale, already-fixed
    # content when add+commit were combined; splitting them into separate calls resolved it
    # cleanly). If Story 5.1's leaking commit was issued the same combined way, the hook
    # would have checked yesterday's index and allowed a commit that only became a leak once
    # the same call's own `git add` ran afterward -- a real, now-demonstrated failure mode,
    # not just a theory. The other hypothesis ($HOME not reliably inherited by the hook
    # subprocess) remains unprovable after the fact. End-to-end tested: the previously-missed
    # bare-path case is now denied; a normal safe commit still passes with no false positive.
  - epic: 5
