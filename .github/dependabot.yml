version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # devDependencies (build/lint/test tooling) bump together in one weekly
      # PR instead of one PR per package. Runtime `dependencies` are left
      # ungrouped so each one still gets its own PR and its own scrutiny.
      npm-dev-dependencies:
        dependency-type: "development"

  # directory is the workspace root, not "/src-tauri": the workspace's single
  # Cargo.lock lives at the repo root (see root Cargo.toml's
  # `[workspace] members = ["src-tauri", "crates/umbra-core"]`) — pointed at
  # "/src-tauri" this ecosystem block matched no lockfile and silently opened
  # zero PRs, which is why the cargo-only alerts had no proposed fixes.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # All four workflow files' action bumps arrive as one weekly PR instead
      # of one per action, so they can be verified against CI together.
      github-actions:
        patterns:
          - "*"
