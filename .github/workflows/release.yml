# Release pipeline (AD-12, FR30, FR32). Tag-driven only (AC4): pushing a `v*` tag is the sole
# trigger — there is no `workflow_dispatch` and no branch-push trigger, deliberately, so "a
# release exists" always means "a human pushed a version tag."
#
# Required GitHub Actions secrets (Settings -> Secrets and variables -> Actions). None of these
# ever live in the repo; `GITHUB_TOKEN` is the one exception and is automatic — do not create it
# as a repo secret.
#
#   APPLE_CERTIFICATE            Base64-encoded export of the Developer ID Application .p12
#                                 certificate (Apple Developer -> Certificates, export from
#                                 Keychain Access as .p12, then `base64 -i cert.p12 | pbcopy`).
#   APPLE_CERTIFICATE_PASSWORD   The password the .p12 was exported with.
#   KEYCHAIN_PASSWORD            Arbitrary — this only protects the ephemeral CI keychain created
#                                 and destroyed within a single job run, not a real credential.
#   APPLE_ID                     The Apple ID email used for notarization.
#   APPLE_PASSWORD                *** An app-specific password from appleid.apple.com, never the
#                                 real Apple ID account password. *** Using the real password is
#                                 the single most common way this exact pipeline shape fails —
#                                 silently and confusingly, deep in notarytool's own auth error,
#                                 not with an obvious "wrong password" message.
#   APPLE_TEAM_ID                Apple Developer Team ID, from the membership page — required
#                                 when an Apple ID belongs to more than one team.
#   TAURI_SIGNING_PRIVATE_KEY    Content of the updater signing private key generated via
#                                 `pnpm tauri signer generate` (Story 5.1 Task 1). Paste the raw
#                                 key file content as the secret value.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#                                 Password for the above key, if one was set at generation time.
#
# This list (what each secret is, where it's used) intentionally stays terse — it's a quick
# reference while editing this file, not the full story. For what each secret IS, why it exists,
# how to regenerate it, and what happens if the Apple Developer Program membership lapses, see
# docs/release-secrets.md — a durable reference written for future-you, not tied to any one story.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      # Same rationale as ci.yml: ort-sys (pulled in by oar-ocr) downloads its ONNX Runtime
      # binary at build time into an OS-specific cache dir that Swatinem/rust-cache doesn't
      # cover. A release build still compiles oar-ocr/ort-sys, so this job needs the same cache.
      ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: verify tag matches tauri.conf.json's version
        # tauri-action reads the app's version strictly from tauri.conf.json, never from the
        # pushed git tag -- the tag only names the GitHub Release. A forgotten version bump means
        # the release publishes under the right tag while the signed app inside still self-reports
        # the old version, silently breaking the updater's version comparison for everyone already
        # on that old version (confirmed to have already happened once: v0.1.0-alpha.1's own build
        # shipped with tauri.conf.json still at "0.1.0", no "-alpha.1" suffix). Runs before any
        # expensive setup/sign/notarize steps so a mismatch fails fast.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match src-tauri/tauri.conf.json's version ($CONF_VERSION). Bump tauri.conf.json to $TAG_VERSION and push that commit before re-tagging."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@3a8b2ad3ea1212417907ff0e1b3d0c4e121bef40 # 1.94.0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cache ort-sys ONNX Runtime binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ORT_CACHE_DIR }}
          key: ${{ runner.os }}-ort-cache-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ort-cache-

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: import Apple Developer Certificate
        # Ephemeral keychain scoped to this job only. -t 3600 keeps it unlocked long enough for
        # the full build+sign+notarize step below without needing repeated unlocks.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          # Extract the Developer ID Application identity (not "Apple Development" — that's the
          # App Store/local-testing identity, not what a downloadable-outside-the-App-Store
          # release needs) into $GITHUB_ENV for the tauri-action step below.
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          # *** Must be an app-specific password from appleid.apple.com, never the real Apple ID
          # account password. See the file-header comment above — this is stated twice on purpose.
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Umbra ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version.'
          releaseDraft: false
          # A tag like v0.1.0-alpha.1 publishes as a GitHub prerelease automatically — this gives
          # the developer a real, safe way to validate the whole pipeline (Task 7) without a bare
          # v0.1.0-style tag looking like the first public release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target aarch64-apple-darwin
