name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # AD-11: `ort-sys` (pulled in by `oar-ocr`, Story 4.1) downloads its ONNX Runtime binary
      # (~150MB) from pyke's own CDN at build time, into an OS-specific user cache directory
      # (`~/Library/Caches/ort.pyke.io` on macOS, `~/.cache/ort.pyke.io` on Linux,
      # `%LOCALAPPDATA%\ort.pyke.io` on Windows — confirmed by reading `ort-sys`'s own
      # `src/internal/dirs.rs`) that `Swatinem/rust-cache` below does NOT cover (it only caches
      # `~/.cargo` and `target/`). Pointing `ORT_CACHE_DIR` at a fixed, workspace-relative path
      # sidesteps the three different OS-default locations and gives the cache step below one
      # single, absolute path to key on across the whole matrix.
      ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Not using awalsh128/cache-apt-pkgs-action here (tried in an earlier commit, reverted):
      # it bootstraps a second unpinned third-party tool (apt-fast, fetched via `curl | bash`
      # from ilikenwf/apt-fast) on every cache miss, and a partial failure permanently poisons
      # its GitHub Actions cache key with zero packages restored on every future run (cache
      # keys are immutable once saved) — exactly what broke this job. Plain apt-get is what
      # Tauri's own official CI docs use for this same step; boring but reliable.
      - if: runner.os == 'Linux'
        name: install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@3a8b2ad3ea1212417907ff0e1b3d0c4e121bef40 # 1.94.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cache ort-sys ONNX Runtime binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ORT_CACHE_DIR }}
          key: ${{ runner.os }}-ort-cache-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ort-cache-

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # TEMPORARY (Story 4.1 CI fix, remove before merge): the Windows test binary
      # (umbra_lib-*.exe) dies at process load with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) —
      # "a DLL was found but a required export is missing" — before any test runs.
      #
      # A prior round of this same diagnostic disproved the initial DirectML hypothesis: the
      # umbra-core test binary (which also links ort/DirectML, but not Tauri) loads and runs
      # fine from the exact same directory, using the exact same locally-symlinked DirectML.dll
      # that ort's copy-dylibs places next to both binaries — so DirectML resolution itself is
      # not the problem.
      #
      # This step is the surgical follow-up: for every DLL the failing umbra_lib.exe imports,
      # resolve that DLL to a real file on disk (same directory first, matching the Windows
      # loader's own search order) and check every symbol umbra_lib.exe imports from it against
      # that file's actual export table via dumpbin. A mismatch there is a byte-for-byte proof
      # of which DLL and which symbol trigger STATUS_ENTRYPOINT_NOT_FOUND — not a guess.
      - if: runner.os == 'Windows'
        name: TEMP diagnose windows loader failure
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --workspace --no-run

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $dumpbin = (Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $dumpbin) {
            Write-Host "dumpbin.exe not found under $vsPath"
            exit 0
          }

          $depsDir = Join-Path (Get-Location).Path "target\debug\deps"
          $searchDirs = @($depsDir, "C:\Windows\System32")
          $umbraLibExe = (Get-ChildItem "$depsDir\umbra_lib-*.exe" | Select-Object -First 1).FullName
          $umbraCoreExe = (Get-ChildItem "$depsDir\umbra_core-*.exe" | Select-Object -First 1).FullName
          Write-Host "umbra_lib exe:  $umbraLibExe"
          Write-Host "umbra_core exe: $umbraCoreExe"

          function Get-Imports($exePath) {
            $out = & $dumpbin /imports $exePath
            $result = @{}
            $currentDll = $null
            foreach ($line in $out) {
              if ($line -match '^\s{4}(\S+\.dll)$') {
                $currentDll = $Matches[1].ToLower()
                $result[$currentDll] = New-Object System.Collections.Generic.List[string]
              } elseif ($currentDll -and $line -match '^\s+[0-9A-Fa-f]+\s+\S*\s+(\S+)$') {
                $result[$currentDll].Add($Matches[1])
              }
            }
            return $result
          }

          function Get-Exports($dllPath) {
            $out = & $dumpbin /exports $dllPath
            $result = New-Object System.Collections.Generic.HashSet[string]
            foreach ($line in $out) {
              if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') {
                [void]$result.Add($Matches[1])
              }
            }
            return $result
          }

          function Resolve-Dll($name) {
            foreach ($dir in $searchDirs) {
              $p = Join-Path $dir $name
              if (Test-Path $p) { return (Resolve-Path $p).Path }
            }
            return $null
          }

          Write-Host "=== raw import table: umbra_lib.exe (FULL) ==="
          & $dumpbin /imports $umbraLibExe

          $libImports = Get-Imports $umbraLibExe
          $coreImports = Get-Imports $umbraCoreExe

          Write-Host "=== dlls umbra_lib.exe imports that umbra_core.exe does not ==="
          $libImports.Keys | Where-Object { $_ -notin $coreImports.Keys } | ForEach-Object { Write-Host $_ }

          Write-Host "=== cross-checking every umbra_lib.exe import against the real export table of its resolved dll ==="
          foreach ($dll in $libImports.Keys) {
            $dllPath = Resolve-Dll $dll
            if (-not $dllPath) {
              Write-Host "!! could not resolve $dll on disk to check its exports"
              continue
            }
            $exports = Get-Exports $dllPath
            $missing = $libImports[$dll] | Where-Object { $_ -and -not $exports.Contains($_) }
            if ($missing) {
              Write-Host "MISSING from $dll (resolved: $dllPath):"
              $missing | ForEach-Object { Write-Host "    $_" }
            } else {
              Write-Host ("OK: {0} ({1} imports satisfied, resolved {2})" -f $dll, $libImports[$dll].Count, $dllPath)
            }
          }

      - name: cargo test
        # --no-fail-fast: cargo stops at the first failing test *target* by default, and
        # `umbra_lib` (src-tauri) always runs before `umbra_core`. Without this flag a failure
        # in umbra_lib hides umbra_core's own test results entirely on that run — surfacing
        # real failures one push at a time instead of all at once.
        run: cargo test --workspace --no-fail-fast

      - if: runner.os == 'Linux'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - if: runner.os == 'Linux'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - if: runner.os == 'Linux'
        name: pnpm install
        run: pnpm install --frozen-lockfile

      - if: runner.os == 'Linux'
        name: cargo fmt --check
        run: cargo fmt --check

      - if: runner.os == 'Linux'
        name: pnpm lint
        run: pnpm lint

      - if: runner.os == 'Linux'
        name: pnpm test
        run: pnpm test

      - if: runner.os == 'Linux'
        name: pnpm build
        run: pnpm build
