name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # AD-11: `ort-sys` (pulled in by `oar-ocr`, Story 4.1) downloads its ONNX Runtime binary
      # (~150MB) from pyke's own CDN at build time, into an OS-specific user cache directory
      # (`~/Library/Caches/ort.pyke.io` on macOS, `~/.cache/ort.pyke.io` on Linux,
      # `%LOCALAPPDATA%\ort.pyke.io` on Windows — confirmed by reading `ort-sys`'s own
      # `src/internal/dirs.rs`) that `Swatinem/rust-cache` below does NOT cover (it only caches
      # `~/.cargo` and `target/`). Pointing `ORT_CACHE_DIR` at a fixed, workspace-relative path
      # sidesteps the three different OS-default locations and gives the cache step below one
      # single, absolute path to key on across the whole matrix.
      ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Not using awalsh128/cache-apt-pkgs-action here (tried in an earlier commit, reverted):
      # it bootstraps a second unpinned third-party tool (apt-fast, fetched via `curl | bash`
      # from ilikenwf/apt-fast) on every cache miss, and a partial failure permanently poisons
      # its GitHub Actions cache key with zero packages restored on every future run (cache
      # keys are immutable once saved) — exactly what broke this job. Plain apt-get is what
      # Tauri's own official CI docs use for this same step; boring but reliable.
      - if: runner.os == 'Linux'
        name: install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@3a8b2ad3ea1212417907ff0e1b3d0c4e121bef40 # 1.94.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cache ort-sys ONNX Runtime binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ORT_CACHE_DIR }}
          key: ${{ runner.os }}-ort-cache-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ort-cache-

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # --no-fail-fast: cargo stops at the first failing test *target* by default, and
        # `umbra_lib` (src-tauri) always runs before `umbra_core`. Without this flag a failure
        # in umbra_lib hides umbra_core's own test results entirely on that run — surfacing
        # real failures one push at a time instead of all at once.
        run: cargo test --workspace --no-fail-fast

      - if: runner.os == 'Linux'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - if: runner.os == 'Linux'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - if: runner.os == 'Linux'
        name: pnpm install
        run: pnpm install --frozen-lockfile

      - if: runner.os == 'Linux'
        name: cargo fmt --check
        run: cargo fmt --check

      - if: runner.os == 'Linux'
        name: pnpm lint
        run: pnpm lint

      - if: runner.os == 'Linux'
        name: pnpm test
        run: pnpm test

      - if: runner.os == 'Linux'
        name: pnpm build
        run: pnpm build
