[package]
name = "umbra-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: without it, Value's object map is a BTreeMap and silently
# alphabetizes keys on parse. A formatter/minifier must round-trip a real
# payload's key order unchanged, so this is a correctness requirement, not
# a style choice — see json.rs's key-order regression tests.
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
uuid = { version = "1.24", features = ["v4", "v7", "std"] }
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
# Story 8.4: SHA3-256 / SHA3-512 (FIPS 202). Same RustCrypto `Digest` trait
# and one-shot API as sha2 (`Sha3_256::digest(bytes)`); shares the resolved
# `digest` 0.11 line. Re-verified current via Context7 (/rustcrypto/hashes).
sha3 = "0.12"
croner = "3"
chrono = "0.4"
oar-ocr = "0.6"
image = "0.25"
# default-features off: pulls in chrono/jiff/time/rayon for PDF metadata date
# conversions and parallel decompression, none of which this module uses (no
# date handling, no compress()). Also sidesteps a live break in lopdf 0.44.0's
# default "time" feature: the resolved time 0.3.45 removed the
# BorrowedFormatItem::StringLiteral variant lopdf's datetime.rs still
# references, so `cargo build` fails with default features on.
lopdf = { version = "0.44", default-features = false }
# Story 8.1 AC10 (Query tab): RFC 9535 JSONPath. Live-verified before adopting
# (this project's standing dependency-verification discipline): the crate runs
# a daily-scheduled "Compliance" GitHub Actions job that checks out the
# official jsonpath-compliance-test-suite as a submodule and runs `cargo test`
# against it — every run on `main` through 2026-08-25 passed, and v0.7.2 (the
# version below) is a real tagged release matching what crates.io serves, not
# just a documentation claim. Default features (`functions`, `regex`) stay on
# since RFC 9535's function extensions (length(), count(), match(), etc.) are
# part of the spec itself, not optional add-ons.
serde_json_path = "0.7"
